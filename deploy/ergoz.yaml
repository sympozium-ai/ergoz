# Ergoz Phase 0: per-node agent DaemonSet + fleet collector.
#
# Requires no RBAC at all: the agent reads host sysfs (hostPath, read-only)
# and the collector discovers agents via their headless Service DNS. Power
# hwmon files are world-readable on vanilla kernels, so everything runs
# non-root today; the future RAPL (CPU package) source will add an opt-in
# privileged mode per project decision D3.
apiVersion: v1
kind: Namespace
metadata:
  name: ergoz-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ergoz-agent
  namespace: ergoz-system
  labels:
    app.kubernetes.io/name: ergoz-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ergoz-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ergoz-agent
    spec:
      containers:
        - name: agent
          image: ghcr.io/sympozium-ai/ergoz:dev
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ERGOZ_SYSFS_ROOT
              value: /host/sys
            - name: ERGOZ_SAMPLE_INTERVAL
              value: "1s"
          ports:
            - containerPort: 9743
              name: metrics
          volumeMounts:
            - name: sysfs
              mountPath: /host/sys
              readOnly: true
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
      volumes:
        - name: sysfs
          hostPath:
            path: /sys
            type: Directory
---
# Headless: the collector resolves this name to every agent pod IP.
apiVersion: v1
kind: Service
metadata:
  name: ergoz-agent
  namespace: ergoz-system
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: ergoz-agent
  ports:
    - name: metrics
      port: 9743
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ergoz-collector
  namespace: ergoz-system
  labels:
    app.kubernetes.io/name: ergoz-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ergoz-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ergoz-collector
    spec:
      containers:
        - name: collector
          image: ghcr.io/sympozium-ai/ergoz:dev
          command: ["/ergoz-collector"]
          env:
            - name: ERGOZ_AGENT_SERVICE
              value: ergoz-agent.ergoz-system.svc.cluster.local
            - name: ERGOZ_SCRAPE_INTERVAL
              value: "5s"
          ports:
            - containerPort: 9744
              name: http
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: ergoz-collector
  namespace: ergoz-system
spec:
  selector:
    app.kubernetes.io/name: ergoz-collector
  ports:
    - name: http
      port: 9744
