apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ergoz-agent
  labels:
    app.kubernetes.io/name: ergoz-agent
    {{- include "ergoz.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ergoz-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ergoz-agent
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: {{ include "ergoz.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ERGOZ_SYSFS_ROOT
              value: /host/sys
            - name: ERGOZ_SAMPLE_INTERVAL
              value: {{ .Values.agent.sampleInterval | quote }}
            - name: ERGOZ_LISTEN
              value: ":{{ .Values.agent.port }}"
          ports:
            - containerPort: {{ .Values.agent.port }}
              name: metrics
          volumeMounts:
            - name: sysfs
              mountPath: /host/sys
              readOnly: true
          securityContext:
            {{- include "ergoz.securityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
      volumes:
        - name: sysfs
          hostPath:
            path: /sys
            type: Directory
