image:
  repository: ghcr.io/sympozium-ai/ergoz
  # -- Defaults to the chart appVersion with a "v" prefix (released images
  # are tagged vX.Y.Z). Override for sideloaded builds (e.g. "dev").
  tag: ""
  pullPolicy: IfNotPresent

# -- For the private ghcr package: [{name: ghcr-pull}]. `ergoz install
# --ghcr-token` creates the secret and sets this automatically.
imagePullSecrets: []

nvidia:
  # -- Host directory containing libnvidia-ml.so.1, mounted read-only into
  # the agent when set (e.g. /usr/lib/x86_64-linux-gnu). Not needed when the
  # NVIDIA container toolkit / device plugin injects the driver libraries.
  libHostDir: ""

agent:
  # -- Power sampling cadence. A hwmon read costs ~5 µs; 1s is cheap.
  # Values below 1s are clamped unless ERGOZ_UNSAFE_FAST_SAMPLING=1.
  sampleInterval: 1s
  # -- Tolerations. A fleet telemetry DaemonSet must reach tainted GPU
  # nodes (the ones that matter most), so it tolerates everything by
  # default — matching node-exporter / dcgm-exporter. Override to narrow.
  tolerations:
    - operator: Exists
  port: 9743
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

collector:
  # -- How often the collector scrapes every agent.
  scrapeInterval: 5s
  port: 9744
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
