name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
# When releases start shipping artifacts (images to ghcr, CLI binaries),
# chain a release workflow off releases_created here, mirroring sympozium.
