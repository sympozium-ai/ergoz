name: Release Please

on:
  push:
    branches: [main]
  # Manual re-publish of assets/image for an existing release tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build assets for (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # CLI binaries + packaged Helm chart attached to the release — these are
  # what install.sh / `gh release download` fetch.
  cli-assets:
    needs: release-please
    if: |
      always() && (
        needs.release-please.outputs.releases_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-build CLI
        run: |
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
                go build -trimpath -ldflags "-s -w -X main.version=${TAG}" \
                -o "dist/ergoz-${os}-${arch}" ./cmd/ergoz
            done
          done
      - name: Package Helm chart
        run: helm package charts/ergoz -d dist/
      - name: Checksums
        run: (cd dist && sha256sum * > checksums.txt)
      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/* --clobber

  # Container image to ghcr — what the chart's default image reference pulls.
  image:
    needs: release-please
    if: |
      always() && (
        needs.release-please.outputs.releases_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/sympozium-ai/ergoz:${{ env.TAG }}
            ghcr.io/sympozium-ai/ergoz:latest
