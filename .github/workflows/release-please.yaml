name: Release Please

on:
  push:
    branches: [main]
  # Manual re-publish of assets/image for an existing release tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build assets for (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Quality gate for releases: rulesets are unavailable on this private
  # repo tier, so the release pipeline itself refuses to publish artifacts
  # from a commit whose CI checks are not green.
  await-ci:
    needs: release-please
    if: |
      always() && (
        needs.release-please.outputs.releases_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    # Workflow-level permissions set every unlisted scope to none, so this
    # job must re-grant read access to query CI workflow runs.
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          # Judge the latest NON-cancelled CI workflow run for this commit.
          # cancel-in-progress leaves cancelled runs on the same SHA; those
          # are noise, not a release blocker.
          for i in $(seq 1 60); do
            runs=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yaml/runs?head_sha=$SHA&per_page=30" --jq '.workflow_runs')
            latest=$(echo "$runs" | jq 'map(select(.conclusion != "cancelled")) | sort_by(.run_started_at) | last')
            status=$(echo "$latest" | jq -r '.status // "none"')
            concl=$(echo "$latest" | jq -r '.conclusion // "none"')
            echo "  CI: status=$status conclusion=$concl"
            if [ "$status" = "completed" ]; then
              [ "$concl" = "success" ] && echo "CI green — releasing" && exit 0
              echo "::error::CI concluded '$concl' — refusing to release"; exit 1
            fi
            sleep 20
          done
          echo "::error::timed out waiting for CI"; exit 1

  # CLI binaries + packaged Helm chart attached to the release — these are
  # what install.sh / `gh release download` fetch.
  cli-assets:
    needs: [release-please, await-ci]
    if: |
      always() && needs.await-ci.result == 'success' && (
        needs.release-please.outputs.releases_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-build CLI
        run: |
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
                go build -trimpath -ldflags "-s -w -X main.version=${TAG}" \
                -o "dist/ergoz-${os}-${arch}" ./cmd/ergoz
            done
          done
      - name: Package Helm chart
        run: helm package charts/ergoz -d dist/
      - name: Checksums
        run: (cd dist && sha256sum * > checksums.txt)
      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/* --clobber

  # Container image to ghcr — what the chart's default image reference pulls.
  image:
    needs: [release-please, await-ci]
    if: |
      always() && needs.await-ci.result == 'success' && (
        needs.release-please.outputs.releases_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/Dockerfile
          push: true
          # amd64 only: arm64 builds under QEMU emulation and stalls the
          # release for 30+ min. Add linux/arm64 back with a native arm64
          # runner if arm64 clusters ever need it.
          platforms: linux/amd64
          tags: |
            ghcr.io/sympozium-ai/ergoz:${{ env.TAG }}
            ghcr.io/sympozium-ai/ergoz:latest
