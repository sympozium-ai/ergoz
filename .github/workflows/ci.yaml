name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded PR runs are wasted compute — cancel them. Main-branch runs are
# NEVER cancelled: any main SHA can become a release commit, and the release
# pipeline's await-ci gate treats a cancelled run as missing (v0.2.1 shipped
# with no assets because a later push cancelled the release commit's CI).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job names below are the required status checks in the main-branch
  # ruleset — rename one and the ruleset must be updated to match.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test (race; includes the synthetic NVML stub via gcc)
        run: go test -race ./...

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dominikh/staticcheck-action@v1
        with:
          install-go: false

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint chart
        run: helm lint charts/ergoz
      - name: Template renders (defaults + nvidia lib mount + pull secret + advertise)
        run: |
          helm template charts/ergoz > /tmp/ergoz-default.yaml
          grep -q 'sympozium.ai/collector: energy' /tmp/ergoz-default.yaml
          helm template charts/ergoz --set sympozium.advertise=false > /tmp/ergoz-quiet.yaml
          if grep -q 'sympozium.ai/collector: energy' /tmp/ergoz-quiet.yaml; then
            echo "::error::advertise=false still set the collector role label"
            exit 1
          fi
          helm template charts/ergoz \
            --set nvidia.libHostDir=/usr/lib/x86_64-linux-gnu \
            --set 'imagePullSecrets[0].name=ghcr-pull' \
            --set image.tag=dev > /dev/null

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/Dockerfile
          push: false
          load: true
          tags: ergoz:ci
      # The purego dynamic-linking / distroless-static mismatch made the
      # agent image unrunnable while every build stayed green — so actually
      # EXECUTE both binaries. Both boot with no cluster and exit non-zero
      # only on exec failure; grep confirms they got past exec.
      - name: Agent boots (exec check)
        run: |
          out=$(docker run --rm -e ERGOZ_SYSFS_ROOT=/nonexistent ergoz:ci 2>&1 & sleep 3; docker ps -q --filter ancestor=ergoz:ci | xargs -r docker kill >/dev/null; true)
          echo "$out" | grep -q "ergoz-agent on" || { echo "::error::agent failed to exec: $out"; exit 1; }
      - name: Collector boots (exec check)
        run: |
          out=$(timeout 3 docker run --rm --entrypoint /ergoz-collector ergoz:ci 2>&1 || true)
          echo "$out" | grep -q "ergoz-collector on" || { echo "::error::collector failed to exec: $out"; exit 1; }

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Real gate: fails on any affecting vuln that is NOT in the reviewed
      # allowlist (.github/govulncheck-allow.txt), so a new finding breaks
      # the build while documented no-fix exceptions don't.
      - name: govulncheck (allowlisted)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... > vuln.txt 2>&1 || true
          cat vuln.txt
          found=$(grep -oE 'GO-[0-9]{4}-[0-9]+' vuln.txt | sort -u || true)
          allow=$(grep -oE 'GO-[0-9]{4}-[0-9]+' .github/govulncheck-allow.txt | sort -u || true)
          unexpected=$(comm -23 <(echo "$found") <(echo "$allow") | grep -E 'GO-' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::unallowlisted vulnerabilities: $unexpected"; exit 1
          fi
          echo "no unallowlisted vulnerabilities"
