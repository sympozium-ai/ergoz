name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same ref are wasted compute — cancel them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job names below are the required status checks in the main-branch
  # ruleset — rename one and the ruleset must be updated to match.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test (race; includes the synthetic NVML stub via gcc)
        run: go test -race ./...

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dominikh/staticcheck-action@v1
        with:
          install-go: false

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint chart
        run: helm lint charts/ergoz
      - name: Template renders (defaults + nvidia lib mount + pull secret)
        run: |
          helm template charts/ergoz > /dev/null
          helm template charts/ergoz \
            --set nvidia.libHostDir=/usr/lib/x86_64-linux-gnu \
            --set 'imagePullSecrets[0].name=ghcr-pull' \
            --set image.tag=dev > /dev/null

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/Dockerfile
          push: false

  # Informational, not a required check: k8s transitive deps make this
  # noisy; a finding should be read, not block a docs commit.
  govulncheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
